    }
    @keyframes pulseWave2 {
      0%, 100% { height: 28px; y: 156px; opacity: 0.55; }
      50% { height: 104px; y: 118px; opacity: 1; }
    }
    @keyframes pulseWave3 {
      0%, 100% { height: 50px; y: 145px; opacity: 0.7; }
      50% { height: 136px; y: 102px; opacity: 1; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes sweepGlow {
      0% { transform: translateX(-100px); opacity: 0.2; }
      50% { transform: translateX(100px); opacity: 0.45; }
      100% { transform: translateX(-100px); opacity: 0.2; }
    }

    .wave-bar-1 { animation: pulseWave1 2.2s ease-in-out infinite; }
    .wave-bar-2 { animation: pulseWave2 1.8s ease-in-out infinite; }
    .wave-bar-3 { animation: pulseWave3 2.5s ease-in-out infinite; }
    .floating-dot { animation: floatParticle 4s ease-in-out infinite; }
    .ambient-glow { animation: sweepGlow 7s ease-in-out infinite; }

    .title-text {
