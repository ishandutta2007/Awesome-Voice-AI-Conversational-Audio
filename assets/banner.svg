<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @keyframes pulseWave1 {
      0%, 100% { height: 16px; y: 232px; opacity: 0.45; }
      50% { height: 74px; y: 203px; opacity: 0.95; }
    }
    @keyframes pulseWave2 {
      0%, 100% { height: 28px; y: 226px; opacity: 0.55; }
      50% { height: 95px; y: 192px; opacity: 1; }
    }
    @keyframes pulseWave3 {
      0%, 100% { height: 45px; y: 217px; opacity: 0.7; }
      50% { height: 115px; y: 182px; opacity: 1; }
    }
    @keyframes sweepGlow {
      0% { transform: translateX(-40px); opacity: 0.2; }
      50% { transform: translateX(40px); opacity: 0.4; }
      100% { transform: translateX(-40px); opacity: 0.2; }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-400px); }
    }

    .wave-bar-1 { animation: pulseWave1 2.2s ease-in-out infinite; }
    .wave-bar-2 { animation: pulseWave2 1.8s ease-in-out infinite; }
    .wave-bar-3 { animation: pulseWave3 2.5s ease-in-out infinite; }
    .ambient-glow { animation: sweepGlow 7s ease-in-out infinite; }
    .wave-bg { animation: waveMove 12s linear infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 0.2px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.4px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Dynamic Glow (Strictly in Background) -->
  <g class="ambient-glow" filter="url(#subtleGlow)">
    <circle cx="240" cy="90" r="130" fill="#38bdf8" opacity="0.12" />
    <circle cx="980" cy="270" r="150" fill="#c084fc" opacity="0.12" />
  </g>

  <!-- Animated Background Soundwaves (Background accent) -->
  <g opacity="0.15">
    <path class="wave-bg" fill="none" stroke="#38bdf8" stroke-width="2"
      d="M 0 310 Q 50 270, 100 310 T 200 310 T 300 310 T 400 310 T 500 310 T 600 310 T 700 310 T 800 310 T 900 310 T 1000 310 T 1100 310 T 1200 310 T 1300 310 T 1400 310 T 1500 310 T 1600 310" />
    <path class="wave-bg" fill="none" stroke="#818cf8" stroke-width="1.8" style="animation-duration: 9s;"
      d="M 0 325 Q 40 295, 80 325 T 160 325 T 240 325 T 320 325 T 400 325 T 480 325 T 560 325 T 640 325 T 720 325 T 800 325 T 880 325 T 960 325 T 1040 325 T 1120 325 T 1200 325 T 1280 325 T 1360 325 T 1440 325 T 1520 325 T 1600 325" />
  </g>

  <!-- Dynamic Equalizer Bars in the Lower-Right Background Area -->
  <g id="equalizer" opacity="0.65">
    <rect class="wave-bar-1" x="900" y="232" width="6" height="16" rx="3" fill="#38bdf8" />
    <rect class="wave-bar-2" x="914" y="226" width="6" height="28" rx="3" fill="#38bdf8" />
    <rect class="wave-bar-3" x="928" y="217" width="6" height="45" rx="3" fill="#60a5fa" />
    <rect class="wave-bar-2" x="942" y="226" width="6" height="28" rx="3" fill="#60a5fa" />
    <rect class="wave-bar-1" x="956" y="232" width="6" height="16" rx="3" fill="#818cf8" />
    <rect class="wave-bar-3" x="970" y="217" width="6" height="45" rx="3" fill="#818cf8" />
    <rect class="wave-bar-2" x="984" y="226" width="6" height="28" rx="3" fill="#a78bfa" />
    <rect class="wave-bar-3" x="998" y="217" width="6" height="45" rx="3" fill="#c084fc" />
    <rect class="wave-bar-2" x="1012" y="226" width="6" height="28" rx="3" fill="#c084fc" />
    <rect class="wave-bar-1" x="1026" y="232" width="6" height="16" rx="3" fill="#e879f9" />
    <rect class="wave-bar-3" x="1040" y="217" width="6" height="45" rx="3" fill="#f43f5e" />
    <rect class="wave-bar-2" x="1054" y="226" width="6" height="28" rx="3" fill="#f43f5e" />
    <rect class="wave-bar-1" x="1068" y="232" width="6" height="16" rx="3" fill="#e879f9" />
    <rect class="wave-bar-2" x="1082" y="226" width="6" height="28" rx="3" fill="#818cf8" />
    <rect class="wave-bar-3" x="1096" y="217" width="6" height="45" rx="3" fill="#38bdf8" />
  </g>

  <!-- Foreground Content Block (High Contrast, Guaranteed Never Hidden) -->
  <g id="foreground-content" transform="translate(60, 42)">
    <!-- Top Category Pill Badges -->
    <g>
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="14" cy="14" r="4.5" fill="#38bdf8" />
        <text x="26" y="19" class="badge-text" fill="#e0f2fe">VOICE AI DIRECTORY</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(192, 0)">
        <rect x="0" y="0" width="190" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="14" cy="14" r="4.5" fill="#818cf8" />
        <text x="26" y="19" class="badge-text" fill="#ede9fe">CONVERSATIONAL AUDIO</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(394, 0)">
        <rect x="0" y="0" width="168" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="14" cy="14" r="4.5" fill="#34d399" />
        <text x="26" y="19" class="badge-text" fill="#d1fae5">SAAS &amp; OPEN-SOURCE</text>
      </g>
    </g>

    <!-- Main Title (Clean Foreground) -->
    <text x="0" y="92" class="title-text" fill="url(#titleGrad)">Awesome Voice AI &amp; Conversational Audio</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="134" class="subtitle-text">Full-Duplex Speech-to-Speech • Real-Time Voice Agents • Sub-200ms STT/TTS Pipelines</text>

    <text x="0" y="166" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
      Curated landscape of category-leading enterprise platforms, low-latency audio frameworks, and open-weight models.
    </text>

    <!-- Bottom Feature Pills Row -->
    <g transform="translate(0, 206)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect width="175" height="34" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#pillShadow)" />
        <text x="14" y="22" class="badge-text" fill="#bae6fd">⚡ Sub-200ms Latency</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(187, 0)">
        <rect width="180" height="34" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#pillShadow)" />
        <text x="14" y="22" class="badge-text" fill="#c7d2fe">🎙️ Full-Duplex S2S</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(379, 0)">
        <rect width="185" height="34" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" filter="url(#pillShadow)" />
        <text x="14" y="22" class="badge-text" fill="#e9d5ff">🌐 Real-Time WebRTC</text>
      </g>
      <!-- Feature 4 -->
      <g transform="translate(576, 0)">
        <rect width="175" height="34" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" filter="url(#pillShadow)" />
        <text x="14" y="22" class="badge-text" fill="#a7f3d0">🚀 Local &amp; Cloud Ready</text>
      </g>
    </g>
  </g>

  <!-- Border Outline -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
</svg>
