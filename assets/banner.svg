  <g transform="translate(1020, 310)" fill="url(#accentGrad)" opacity="0.6">
    <rect class="sound-bar" x="0" y="-70" width="5" height="70" rx="2.5" style="animation-delay: 0.5s;"/>
    <rect class="sound-bar" x="12" y="-115" width="5" height="115" rx="2.5" style="animation-delay: 0.2s;"/>
    <rect class="sound-bar" x="24" y="-80" width="5" height="80" rx="2.5" style="animation-delay: 0.8s;"/>
